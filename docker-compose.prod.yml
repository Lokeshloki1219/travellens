# ---------------------------------------------------------------------------
# TravelLens production stack - Milestone 4
#
# What changed from Milestone 3:
#
#   - The postgres service is gone. The database is Cloud SQL, reached on a
#     private IP over VPC peering. No database container, no pgdata volume.
#   - The uploads volume is gone. Traveler media lives in a Cloud Storage
#     bucket and is read back through the application.
#   - There is no .env file and no secret in this file. Every value below is
#     non-sensitive configuration; the database password and the JWT signing
#     key are read from Secret Manager by the container entrypoint at startup.
#
# Nothing in this stack holds state. Deleting the VM loses the containers and
# nothing else.
#
# Usage on the VM:  docker compose -f docker-compose.prod.yml up -d
# ---------------------------------------------------------------------------

services:
  backend:
    image: us-central1-docker.pkg.dev/travellens-ccp/travellens/backend:v2
    pull_policy: always
    environment:
      # Cloud SQL private IP. Replace CLOUD_SQL_PRIVATE_IP with the address
      # from: gcloud sql instances describe travellens-db
      SPRING_DATASOURCE_URL: jdbc:postgresql://CLOUD_SQL_PRIVATE_IP:5432/springboot
      SPRING_DATASOURCE_USERNAME: travellens
      # Bucket name only - the identity used to reach it is the VM's service
      # account, resolved through the metadata server. No key file.
      APP_STORAGE_BUCKET: travellens-uploads-travellens-ccp
      # Secret names, not secret values.
      DB_PASSWORD_SECRET: travellens-db-password
      JWT_SECRET_NAME: travellens-jwt-secret
    networks:
      - travellens
    restart: unless-stopped
    # No ports: only nginx talks to the API.
    # No volumes: the container is entirely stateless.

  frontend:
    image: us-central1-docker.pkg.dev/travellens-ccp/travellens/frontend:v1
    pull_policy: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - travellens
    restart: unless-stopped

networks:
  travellens:
    driver: bridge
