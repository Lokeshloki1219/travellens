# ---------------------------------------------------------------------------
# Internal Service for the backend.
#
# The name matters. In Milestone 3 nginx proxied to http://backend:8080, where
# "backend" was a Docker Compose service name resolved by Docker's internal
# DNS. Calling this Service "backend" on port 8080 means that exact nginx
# config keeps working unchanged on Kubernetes - the name now resolves through
# kube-dns instead, to a virtual IP that load-balances across whatever backend
# pods are Ready at that instant.
#
# This is a ClusterIP, so it has no external address. The only way in from the
# internet is the Ingress, through the frontend. The API is not exposed
# directly, exactly as it was not exposed directly in Milestone 3.
#
# "Whatever pods are Ready" is the whole mechanism behind the readiness probe:
# a pod that fails /healthz/ready is removed from this Service's endpoint list
# within a few seconds and receives no further requests.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: default
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
