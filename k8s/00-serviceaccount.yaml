# ---------------------------------------------------------------------------
# Kubernetes ServiceAccount for the TravelLens pods.
#
# This is the Milestone 4 identity story carried onto Kubernetes. In Milestone 4
# the container got its Google identity from the VM it happened to be running
# on: the metadata server handed out a token for the service account attached to
# travellens-vm. On GKE that no longer applies, because a pod does not belong to
# one machine.
#
# Workload Identity Federation replaces it. This Kubernetes ServiceAccount is
# bound to the Google service account below, so every pod that runs as
# travellens-sa can ask the GKE metadata server for a token and receive one
# issued for travellens-vm@travellens-ccp.iam.gserviceaccount.com.
#
# The important consequence: entrypoint.sh did not have to change. It still
# calls metadata.google.internal, still gets a token, still reads both secrets
# from Secret Manager. There is still no key file anywhere in the cluster, and
# no Kubernetes Secret object holding a password.
#
# Note also what this buys over the old behaviour. Without Workload Identity,
# every pod on a node can read the node's service account token, so a single
# compromised sidecar would inherit the node's full permissions. With it, only
# pods running as this ServiceAccount get the identity.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: travellens-sa
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: travellens-vm@travellens-ccp.iam.gserviceaccount.com
