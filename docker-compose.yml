# Local development stack. Builds the images from source.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: springboot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d springboot"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - travellens
    restart: unless-stopped
    # No ports: entry. The database is reachable only from inside the
    # travellens network, never from the host or the internet.

  backend:
    build:
      context: ./travellens-backend
    image: us-central1-docker.pkg.dev/travellens-ccp/travellens/backend:v1
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/springboot
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is not set}
      APP_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - travellens
    restart: unless-stopped
    # No ports: entry either. Only nginx talks to the API.

  frontend:
    build:
      context: ./travellens-frontend
    image: us-central1-docker.pkg.dev/travellens-ccp/travellens/frontend:v1
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - travellens
    restart: unless-stopped

volumes:
  pgdata:
  uploads:

networks:
  travellens:
    driver: bridge
