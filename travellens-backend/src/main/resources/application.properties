spring.application.name=backend

# ----------------------------
# PostgreSQL Database
# ----------------------------
# Every environment-specific value comes from the environment. The URL and
# username have safe local defaults; the password has NO default on purpose,
# so the application refuses to start rather than run with a guessable
# credential. Nothing secret is stored in this file, so nothing secret is
# compiled into the jar or baked into the container image.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/springboot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------
# JPA / Hibernate
# ----------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ----------------------------
# Server
# ----------------------------
server.port=8080

# ----------------------------
# File upload (traveler post media)
# ----------------------------
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ----------------------------
# JWT
# ----------------------------
# No default: a missing signing key is a startup failure, not a silent
# fallback to a key that is public in the repository.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000
