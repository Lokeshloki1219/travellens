spring.application.name=backend

# ----------------------------
# PostgreSQL / Cloud SQL
# ----------------------------
# Every environment-specific value comes from the environment. The password has
# NO default on purpose: the application refuses to start rather than run with a
# guessable credential. At run time the password is not an .env value either -
# the container entrypoint reads it from Secret Manager using the VM's service
# account and exports it just before the JVM starts.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/springboot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cloud SQL sits on a private IP reached over VPC peering. A slightly longer
# connection timeout avoids spurious startup failures while the instance wakes.
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ----------------------------
# Flyway (schema migrations)
# ----------------------------
# The schema is created by db/migration/V1__initial_schema.sql, not by
# Hibernate. ddl-auto=validate makes Hibernate verify that the entities match
# the migrated schema and fail fast if the two ever drift apart.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ----------------------------
# JPA / Hibernate
# ----------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ----------------------------
# File upload (traveler post media)
# ----------------------------
# Bucket name only. There is no local upload directory any more: media is
# written to Cloud Storage by StorageService and read back by MediaController.
app.storage.bucket=${APP_STORAGE_BUCKET}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ----------------------------
# JWT
# ----------------------------
# No default: a missing signing key is a startup failure, not a silent fallback
# to a key that is public in the repository. Supplied from Secret Manager.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000
