# ---------------------------------------------------------------------------
# TravelLens frontend - Milestone 5
#
# Unchanged from Milestone 3 except for the /healthz block. That is worth
# stating plainly: moving from Docker Compose on one VM to a Kubernetes
# Deployment behind a Google load balancer required no change to the reverse
# proxy, because "backend" resolves the same way in both worlds - a Compose
# service name there, a Kubernetes Service name here.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The backend accepts 15 MB uploads; nginx defaults to 1 MB and would
    # reject traveler photos with 413 before they ever reached Spring Boot.
    client_max_body_size 20M;

    # -----------------------------------------------------------------------
    # Milestone 5: health endpoint for this container.
    #
    # Three separate things probe this path, all of them several times a
    # minute: the kubelet liveness probe, the kubelet readiness probe, and the
    # Google load balancer health check defined in 05-backendconfig.yaml.
    #
    # It has to be its own location block rather than just using "/". The
    # try_files rule below falls back to index.html for any unknown path, so a
    # health check against "/" returns 200 even if the bundle is missing, the
    # disk is unreadable, or the wrong image was deployed - it can only ever
    # succeed, which makes it worthless as a check.
    #
    # access_log off keeps roughly ten probe requests a second out of the pod
    # logs, which otherwise bury anything real.
    # -----------------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # React Router owns the client-side routes, so unknown paths must fall
    # back to index.html instead of 404ing on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # "backend" is the Kubernetes Service name, resolved by kube-dns to a
    # virtual IP that load-balances across every backend pod currently passing
    # its readiness probe. No pod IPs anywhere, and the set of pods behind it
    # changes as the autoscaler scales - nginx never needs to know.
    #
    # X-Forwarded-Proto is hardcoded to https because TLS terminates at the
    # terminated at the load balancer. The load balancer sets its own
    # X-Forwarded-Proto: https on the way in, which is the header the
    # application would use if it ever needed to build an absolute URL.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Traveler photos. The object lives in the Cloud Storage bucket; the
    # backend reads it with the pod's Workload Identity and streams it back, so
    # the bucket itself stays private with public access prevention enforced.
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
