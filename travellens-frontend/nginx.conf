server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The backend accepts 15 MB uploads; nginx defaults to 1 MB and would
    # reject traveler photos with 413 before they ever reached Spring Boot.
    client_max_body_size 20M;

    # React Router owns the client-side routes, so unknown paths must fall
    # back to index.html instead of 404ing on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # "backend" is the Compose service name, resolved by Docker's internal DNS
    # on the travellens network. No IP addresses anywhere.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
